                                title: "Chương X. Một số hình khối trong thực tiễn",
                                items: [
                                    "Bài 31: Hình trụ và hình nón<span class='objective-text'><i class='fa-solid fa-bullseye text-blue-500 mr-1'></i><b>Trọng tâm:</b> Phân biệt đường sinh (l), chiều cao (h), bán kính (r). Thuộc công thức $S_{xq}$ và $V$. (Thường là câu cho điểm).</span>",
                                    "Bài 32: Hình cầu<span class='objective-text'><i class='fa-solid fa-bullseye text-blue-500 mr-1'></i><b>Trọng tâm:</b> Khái niệm mặt cầu, khối cầu. Công thức Thể tích và Diện tích mặt cầu.</span>"
                                ]
                            }
                        ]
                    }
                ]
            },
            // Các môn khác giữ nguyên cấu trúc
            {
                id: "nguvan",
                title: "Ngữ Văn 9",
                icon: "fa-feather",
                color: "bg-purple-500",
                textColor: "text-purple-500",
                sections: [
                    {
                        title: "TẬP MỘT",
                        chapters: [
                            {
                                title: "Bài 1: Thế giới kì ảo (Truyện truyền kì)",
                                items: ["Đọc: Chuyện người con gái Nam Xương, Dế chọi, Sơn Tinh – Thuỷ Tinh"]
                            }
                        ]
                    }
                ]
            }
        ];

        // Code JS rendering giữ nguyên như nguyên bản của bạn...
        const contentArea = document.getElementById('contentArea');
        const subjectFiltersContainer = document.getElementById('subjectFilters');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const noResultsEl = document.getElementById('noResults');

        let currentFilter = 'all';
        let searchQuery = '';

        function renderContent(data) {
            contentArea.innerHTML = '';
            let hasResults = false;

            data.forEach(subject => {
                if (currentFilter !== 'all' && subject.id !== currentFilter) return;

                const filteredSections = processSearch(subject.sections, searchQuery);
                if (filteredSections.length === 0 && searchQuery) return;
                hasResults = true;

                const subjectCard = document.createElement('div');
                subjectCard.className = 'subject-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6';
                
                let html = `
                    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors" onclick="toggleAccordion('subject-${subject.id}')">
                        <div class="flex items-center gap-3">
                            <div class="${subject.color} text-white w-10 h-10 rounded-lg flex items-center justify-center shadow-inner">
                                <i class="fa-solid ${subject.icon} text-lg"></i>
                            </div>
                            <h2 class="text-xl font-bold ${subject.textColor}">${subject.title}</h2>
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300" id="icon-subject-${subject.id}"></i>
                    </div>
                    <div id="subject-${subject.id}" class="accordion-content active">
                        <div class="p-6 space-y-8">
                `;

                filteredSections.forEach(section => {
                    html += `
                        <div>
                            <h3 class="text-sm font-bold text-slate-400 tracking-wider uppercase mb-4 border-b border-slate-100 pb-2">${highlightText(section.title, searchQuery)}</h3>
                            <div class="space-y-6">
                    `;

                    section.chapters.forEach(chapter => {
                        html += `
                            <div class="pl-2 border-l-2 border-${subject.textColor.split('-')[1]}-200">
                                <h4 class="font-semibold text-slate-800 mb-2">${highlightText(chapter.title, searchQuery)}</h4>
                                <ul class="space-y-2 text-sm text-slate-600 list-none pl-4">
                        `;
                        
                        chapter.items.forEach(item => {
                            html += `<li class="relative before:content-['•'] before:absolute before:-left-4 before:text-slate-300">${highlightText(item, searchQuery)}</li>`;
                        });

                        html += `</ul></div>`;
                    });

                    html += `</div></div>`;
                });

                html += `</div></div>`;
                subjectCard.innerHTML = html;
                contentArea.appendChild(subjectCard);
            });

            if (!hasResults) {
                noResultsEl.classList.remove('hidden');
            } else {
                noResultsEl.classList.add('hidden');
            }
        }

        function processSearch(sections, query) {
            if (!query) return sections;
            const lowerQuery = query.toLowerCase();
            
            return sections.map(section => {
                const sectionMatches = section.title.toLowerCase().includes(lowerQuery);
                const filteredChapters = section.chapters.map(chapter => {
                    const chapterMatches = chapter.title.toLowerCase().includes(lowerQuery);
                    const filteredItems = chapter.items.filter(item => item.toLowerCase().includes(lowerQuery));
                    
                    if (chapterMatches || filteredItems.length > 0 || sectionMatches) {
                        return {
                            ...chapter,
                            items: (chapterMatches || sectionMatches) && filteredItems.length === 0 ? chapter.items : filteredItems
                        };
                    }
                    return null;
                }).filter(Boolean);

                if (sectionMatches || filteredChapters.length > 0) {
                    return {
                        ...section,
                        chapters: sectionMatches && filteredChapters.length === 0 ? section.chapters : filteredChapters
                    };
                }
                return null;
            }).filter(Boolean);
        }

        function highlightText(text, query) {
            if (!query) return text;
            
            // Xử lý cẩn thận để không replace vào các thẻ HTML <span class="...">
            // Tạo 1 regex chỉ match text nằm ngoài thẻ HTML. (Cách tạm thời an toàn nhất)
            // Vì đây là HTML nâng cao, ta có thể bỏ highlight nếu text có chứa class html 
            if(text.includes('<span class=')) {
                return text; // Giữ nguyên không highlight thẻ HTML để tránh vỡ giao diện
            }
            
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        window.toggleAccordion = function(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            
            if (content.classList.contains('active')) {
                content.classList.remove('active');
                content.style.maxHeight = '0';
                content.style.opacity = '0';
                icon.style.transform = 'rotate(-90deg)';
            } else {
                content.classList.add('active');
                content.style.maxHeight = '5000px'; 
                content.style.opacity = '1';
                icon.style.transform = 'rotate(0deg)';
            }
        };

        function initFilters() {
            textbookData.forEach(subject => {
                const btn = document.createElement('button');
                btn.className = `filter-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-sm font-medium hover:bg-slate-50 transition-colors whitespace-nowrap`;
                btn.dataset.subject = subject.id;
                btn.innerText = subject.title;
                btn.onclick = () => setFilter(subject.id, btn);
                subjectFiltersContainer.appendChild(btn);
            });
        }

        function setFilter(subjectId, activeBtn = null) {
            currentFilter = subjectId;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.subject === subjectId) {
                    btn.classList.add('bg-primary', 'text-white', 'border-primary');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                } else {
                    btn.classList.remove('bg-primary', 'text-white', 'border-primary');
                    btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                }
            });
            renderContent(textbookData);
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
                document.querySelectorAll('.accordion-content').forEach(el => {
                    el.classList.add('active');
                    el.style.maxHeight = '5000px';
                    el.style.opacity = '1';
                    const icon = document.getElementById('icon-' + el.id);
                    if(icon) icon.style.transform = 'rotate(0deg)';
                });
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderContent(textbookData);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderContent(textbookData);
            searchInput.focus();
        });

        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            document.querySelector('[data-subject="all"]').onclick = function() {
                setFilter('all', this);
            };
            // Default filter là Toán 9 để giáo viên vào xem ngay
            setFilter('toan11'); 
        });

    </script>
</body>
</html>
