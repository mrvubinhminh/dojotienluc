                    html += `
                        <div>
                            <h3 class="text-sm font-bold text-slate-400 tracking-wider uppercase mb-4 border-b border-slate-100 pb-2">${highlightText(section.title, searchQuery)}</h3>
                            <div class="space-y-6">
                    `;

                    section.chapters.forEach(chapter => {
                        html += `
                            <div class="pl-2 border-l-2 border-${subject.textColor.split('-')[1]}-200">
                                <h4 class="font-semibold text-slate-800 mb-2">${highlightText(chapter.title, searchQuery)}</h4>
                                <ul class="space-y-2 text-sm text-slate-600 list-none pl-4">
                        `;
                        
                        chapter.items.forEach(item => {
                            html += `<li class="relative before:content-['•'] before:absolute before:-left-4 before:text-slate-300">${highlightText(item, searchQuery)}</li>`;
                        });

                        html += `</ul></div>`;
                    });

                    html += `</div></div>`;
                });

                html += `</div></div>`;
                subjectCard.innerHTML = html;
                contentArea.appendChild(subjectCard);
            });

            if (!hasResults) {
                noResultsEl.classList.remove('hidden');
            } else {
                noResultsEl.classList.add('hidden');
            }
        }

        function processSearch(sections, query) {
            if (!query) return sections;
            const lowerQuery = query.toLowerCase();
            
            return sections.map(section => {
                const sectionMatches = section.title.toLowerCase().includes(lowerQuery);
                const filteredChapters = section.chapters.map(chapter => {
                    const chapterMatches = chapter.title.toLowerCase().includes(lowerQuery);
                    const filteredItems = chapter.items.filter(item => item.toLowerCase().includes(lowerQuery));
                    
                    if (chapterMatches || filteredItems.length > 0 || sectionMatches) {
                        return {
                            ...chapter,
                            items: (chapterMatches || sectionMatches) && filteredItems.length === 0 ? chapter.items : filteredItems
                        };
                    }
                    return null;
                }).filter(Boolean);

                if (sectionMatches || filteredChapters.length > 0) {
                    return {
                        ...section,
                        chapters: sectionMatches && filteredChapters.length === 0 ? section.chapters : filteredChapters
                    };
                }
                return null;
            }).filter(Boolean);
        }

        function highlightText(text, query) {
            if (!query) return text;
            
            // Xử lý cẩn thận để không replace vào các thẻ HTML <span class="...">
            // Tạo 1 regex chỉ match text nằm ngoài thẻ HTML. (Cách tạm thời an toàn nhất)
            // Vì đây là HTML nâng cao, ta có thể bỏ highlight nếu text có chứa class html 
            if(text.includes('<span class=')) {
                return text; // Giữ nguyên không highlight thẻ HTML để tránh vỡ giao diện
            }
            
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        window.toggleAccordion = function(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            
            if (content.classList.contains('active')) {
                content.classList.remove('active');
                content.style.maxHeight = '0';
                content.style.opacity = '0';
                icon.style.transform = 'rotate(-90deg)';
            } else {
                content.classList.add('active');
                content.style.maxHeight = '5000px'; 
                content.style.opacity = '1';
                icon.style.transform = 'rotate(0deg)';
            }
        };

        function initFilters() {
            textbookData.forEach(subject => {
                const btn = document.createElement('button');
                btn.className = `filter-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-sm font-medium hover:bg-slate-50 transition-colors whitespace-nowrap`;
                btn.dataset.subject = subject.id;
                btn.innerText = subject.title;
                btn.onclick = () => setFilter(subject.id, btn);
                subjectFiltersContainer.appendChild(btn);
            });
        }

        function setFilter(subjectId, activeBtn = null) {
            currentFilter = subjectId;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.subject === subjectId) {
                    btn.classList.add('bg-primary', 'text-white', 'border-primary');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                } else {
                    btn.classList.remove('bg-primary', 'text-white', 'border-primary');
                    btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                }
            });
            renderContent(textbookData);
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
                document.querySelectorAll('.accordion-content').forEach(el => {
                    el.classList.add('active');
                    el.style.maxHeight = '5000px';
                    el.style.opacity = '1';
                    const icon = document.getElementById('icon-' + el.id);
                    if(icon) icon.style.transform = 'rotate(0deg)';
                });
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderContent(textbookData);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderContent(textbookData);
            searchInput.focus();
        });

        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            document.querySelector('[data-subject="all"]').onclick = function() {
                setFilter('all', this);
            };
            // Default filter là Toán 9 để giáo viên vào xem ngay
            setFilter('toan'); 
        });

    </script>
</body>
</html>
